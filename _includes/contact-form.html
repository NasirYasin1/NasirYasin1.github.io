<style>
  .ct-card {
    max-width: 640px; margin: 2.5em 0 2em; padding: 2em 2em 1.6em;
    background: var(--global-bg-color); color: var(--global-text-color);
    border: 1px solid var(--global-border-color); border-radius: 12px;
  }
  .ct-card .ct-title { margin: 0 0 .3em; padding: 0; border: none; font-size: 1.6em; font-weight: 700; line-height: 1.25; color: var(--global-text-color); }
  .ct-intro { margin: 0 0 1em; color: var(--global-text-color-light); }
  .ct-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1em; }
  @media (max-width: 600px) { .ct-row { grid-template-columns: 1fr; } .ct-card { padding: 1.5em 1.2em; } }
  .ct-card label { display: block; margin: 1em 0 .4em; font-size: .9em; font-weight: 700; color: var(--global-text-color); }
  .ct-card input, .ct-card textarea {
    width: 100%; box-sizing: border-box; padding: .7em .85em; font: inherit;
    color: var(--global-text-color); background: var(--global-bg-color);
    border: 1px solid var(--global-border-color); border-radius: 6px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .ct-card input::placeholder, .ct-card textarea::placeholder { color: var(--global-text-color-light); }
  .ct-card input:focus, .ct-card textarea:focus { border-color: #2f7f93; box-shadow: 0 0 0 3px rgba(47,127,147,.15); }
  .ct-card textarea { min-height: 150px; resize: vertical; }
  .ct-actions { display: flex; justify-content: flex-end; margin-top: 1.4em; }
  .ct-send {
    padding: .65em 1.8em; font: inherit; font-weight: 700; color: #fff;
    background: #2f7f93; border: none; border-radius: 6px; cursor: pointer; transition: background .2s;
  }
  .ct-send:hover { background: #25677a; }
</style>

<div class="ct-card" markdown="0">
  <h2 class="ct-title">Contact</h2>
  <p class="ct-intro">For inquiries about research, teaching or collaboration, please use the form below.</p>

  <form id="ct-form">
    <div class="ct-row">
      <div>
        <label for="ct-name">Name</label>
        <input id="ct-name" type="text" placeholder="Your full name" required>
      </div>
      <div>
        <label for="ct-email">Email</label>
        <input id="ct-email" type="email" placeholder="name@example.com" required>
      </div>
    </div>

    <label for="ct-subject">Subject</label>
    <input id="ct-subject" type="text" placeholder="Subject of your message">

    <label for="ct-message">Message</label>
    <textarea id="ct-message" placeholder="Write your message here" required></textarea>

    <div class="ct-actions"><button type="submit" class="ct-send">Send Message</button></div>
  </form>
</div>

<script>
  document.getElementById("ct-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = document.getElementById("ct-name").value;
    var email = document.getElementById("ct-email").value;
    var subject = document.getElementById("ct-subject").value || ("Message from " + name);
    var message = document.getElementById("ct-message").value;
    var body = message + "\n\n" + name + "\n" + email;
    window.location.href = "mailto:nasirktk1996@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  });
</script>
